version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oga_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oga_user
      POSTGRES_PASSWORD: oga_secret
      POSTGRES_DB: oga_dashboard
    ports:
      - '5432:5432'
    volumes:
      - oga_postgres_data:/var/lib/postgresql/data

volumes:
  oga_postgres_data:
